name: Smart Contract Security Audit & Lint

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'contracts/**'
      - '.github/workflows/contract-security.yml'

jobs:
  clippy:
    name: Run Cargo Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run Clippy
        working-directory: ./contracts
        run: cargo clippy --all-targets -- -D warnings -A clippy::inconsistent_digit_grouping

  audit:
    name: Run Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # rustsec/audit-check@v1.4.1 dropped its `path` input (it now only accepts
      # `token`/`ignore`) and always operates on the repo root, but our
      # Cargo.toml lives in ./contracts — so we run cargo-audit directly instead
      # of via that action, giving us a real, schema-valid working-directory.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Cargo Audit
        working-directory: ./contracts
        run: cargo audit
