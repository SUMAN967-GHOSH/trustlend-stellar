name: Vercel Preview Deployment

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Cancel any in-progress preview deploy for the same PR so only the latest
# commit gets a preview (saves CI minutes).
concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post the preview-URL comment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          {
            echo 'deploymentUrl<<EOF'
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            // Inlined from lib/deployment/parse-deployment-url.ts (cannot require .ts)
            const parseDeploymentUrl = (raw) => {
              if (!raw || !raw.trim()) throw new Error('Empty Vercel deploy output — no URL to parse');
              const lines = raw.trim().split(/\r?\n/);
              const url = lines.filter((l) => /^https:\/\//.test(l.trim())).pop()?.trim();
              if (!url) throw new Error('No valid deployment URL found in Vercel output');
              return url;
            };
            const buildPreviewComment = (url) =>
              `## ✅ Vercel Preview Deployment\n\n🔗 **Preview URL:** ${url}\n\nThis preview was automatically deployed for this pull request. Every new push will update the preview automatically.`;

            const rawOutput = `${{ steps.deploy.outputs.deploymentUrl }}`;
            const url = parseDeploymentUrl(rawOutput);

            // Remove any previous preview-comments by this bot so the PR
            // thread doesn't get cluttered on every push.
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(
              (c) =>
                c.user.type === 'Bot' &&
                c.body.includes('Vercel Preview Deployment'),
            );
            if (botComment) {
              await github.rest.issues.deleteComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: buildPreviewComment(url),
            });
