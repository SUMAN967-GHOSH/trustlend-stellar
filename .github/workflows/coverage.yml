name: Code Coverage (cargo-tarpaulin)

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'contracts/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'contracts/**'
      - '.github/workflows/coverage.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Tarpaulin Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run tarpaulin (code coverage)
        working-directory: ./contracts
        run: |
          cargo tarpaulin \
            --workspace \
            --out Xml \
            --output-dir ./coverage \
            --engine llvm \
            --skip-clean \
            --exclude-files "**/test.rs" \
            --exclude-files "**/tests/**" \
            --exclude-files "**/target/**" \
            --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./contracts/coverage/cobertura.xml
          flags: rust-contracts
          name: tarpaulin-rust-contracts
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
