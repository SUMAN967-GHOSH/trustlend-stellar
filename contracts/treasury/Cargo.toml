[package]
name    = "treasury"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
lending = { path = "../lending", features = ["testutils"] }
default-management = { path = "../default_management", features = ["testutils"] }
governance = { path = "../governance", features = ["testutils"] }
